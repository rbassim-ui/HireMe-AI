<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - HireMe AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Interview Results</h1>
    </header>
    
    <main>
        <section id="results-container">
            <div id="score-card">
                <h2>Your Score</h2>
                <div class="score-display">
                    <span id="overall-score">0</span>%
                </div>
            </div>
            
            <div id="analytics">
                <h3>Detailed Analytics</h3>
                <ul id="metrics-list">
                    <li>Loading metrics...</li>
                </ul>
            </div>
            
            <div id="recommendations">
                <h3>Recommendations</h3>
                <ul id="recommendations-list">
                    <li>Analyze your responses to get personalized feedback</li>
                </ul>
            </div>
            
            <button id="home-btn">Back to Home</button>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 HireMe AI. All rights reserved.</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
